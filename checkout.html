<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Checkout | SmartBite</title>
        <link rel="stylesheet" href="/assets/site.css">
    </head>
    <body>
        <header class="topbar">
            <div class="wrap navrow">
                <a class="brand" href="/">
                    <span class="brand-mark">♨</span>Smart<span>Bite</span></a>
                    <nav class="navlinks"><a href="/">Home</a>
                        <a href="/menu.html">Menu</a>
                        <a href="/track-order.html">Track order</a></nav>
                        <a class="btn btn-primary" href="/cart.html">My cart <span id="cartCount">0</span></a>
                    </div>
                </header>
                <section class="page-head">
                    <div class="wrap">
                        <span class="eyebrow">ONE LAST STEP</span>
                        <h1>Checkout</h1>
                        <p>Your food is almost ready to be ordered.</p>
                    </div>
                </section><main class="section">
                    <div class="wrap two-col">
                        <form id="checkoutForm" class="panel stack">
                            <h2>Your details</h2>
                            <div class="form-grid">
                                <div class="field full">
                                    <label for="customerName">Full name</label>
                                    <input id="customerName" name="customerName" required maxlength="100" autocomplete="name">
                                </div>
                                <div class="field">
                                    <label for="customerEmail">Email</label>
                                    <input id="customerEmail" name="customerEmail" type="email" required autocomplete="email"></div>
                                    <div class="field">
                                        <label for="customerPhone">Phone number</label>
                                        <input id="customerPhone" name="customerPhone" type="tel" required maxlength="30" autocomplete="tel"></div>
                                        <div class="field full">
                                            <label for="paymentMethod">Payment method</label>
                                            <select id="paymentMethod">
                                                <option>Pay at pickup</option>
                                                <option>UPI (demo)</option>
                                            </select>
                                            <small style="color:var(--muted)">UPI is a demo selection; no real payment is processed.</small>
                                        </div>
                                    </div>
                                    <button class="btn btn-primary" type="submit">Place order →</button>
                                    <p><a href="/cart.html">← Back to cart</a></p>
                                </form><aside class="panel">
                                    <span class="eyebrow">YOUR ORDER</span>
                                    <h2>Summary</h2>
                                    <div id="checkoutSummary"></div>
                                </aside></div></main>
                                <script src="/assets/app.js" defer></script>
                            </body>
                            </html>
